name: Windows EXE Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları yükle
        run: python -m pip install -r requirements.txt

      - name: EXE oluştur
        run: python -m PyInstaller --noconfirm --clean --windowed --name SEYMEN_Kontrol_Formu_Arsiv_Analizi app.py

      - name: EXE paketini yükle
        uses: actions/upload-artifact@v4
        with:
          name: SEYMEN_Kontrol_Formu_Arsiv_Analizi_Windows
          path: dist/SEYMEN_Kontrol_Formu_Arsiv_Analizi/
