name: macOS App Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # Intel macOS 13 runner creates a bundle compatible with macOS Catalina.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Build macOS app
        run: python3 -m PyInstaller --noconfirm --clean --windowed --name SEYMEN_Kontrol_Formu_Arsiv_Analizi app.py
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: SEYMEN_Kontrol_Formu_Arsiv_Analizi_macOS
          path: dist/SEYMEN_Kontrol_Formu_Arsiv_Analizi.app
